# Deploy otomatis: build image di GitHub Actions -> push ke GHCR -> runner
# self-hosted di server sendiri yang pull & restart (tidak lewat SSH dari luar,
# lihat catatan di README kenapa: IP GitHub-hosted runner sering ditolak
# jaringan IDCloudHost meskipun key/config sudah benar).
#
# Secrets yang harus diisi (Settings -> Secrets and variables -> Actions):
#   APP_DIR   : (opsional) folder aplikasi di server, bawaan /opt/santri
#
# Persiapan server satu kali: lihat bagian "Deploy Otomatis dari GitHub" di README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  audit:
    name: Audit keamanan dependency (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Non-blocking dulu: masih ada beberapa kerentanan lama (next, drizzle-orm) yang
      # perlu upgrade terpisah. Setelah semuanya beres, hapus "|| true" agar deploy
      # otomatis gagal saat ada kerentanan high/critical baru.
      - name: npm audit (high & critical)
        run: npm audit --omit=dev --audit-level=high || true

  build:
    name: Build & push image ke GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan tag image dari commit
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Ganti/tambah platform bila server bukan x86_64 (mis. linux/arm64).
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke server
    runs-on: self-hosted
    needs: build
    environment: production
    env:
      APP_DIR: ${{ secrets.APP_DIR || '/opt/santri' }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Salin docker-compose.prod.yml ke folder aplikasi
        run: cp docker-compose.prod.yml "$APP_DIR/"

      - name: Pull image & restart aplikasi
        run: |
          set -e
          cd "$APP_DIR"

          if [ ! -f .env ]; then
            echo "ERROR: file .env belum ada di $APP_DIR."
            echo "Buat dulu (minimal berisi AUTH_SECRET) — lihat README bagian Deploy Otomatis."
            exit 1
          fi

          # GITHUB_TOKEN hanya berlaku selama workflow berjalan — cukup untuk pull saat ini.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f > /dev/null

          # Tunggu aplikasi merespons (boot pertama menjalankan inisialisasi database).
          PORT=$(grep -E '^APP_PORT=' .env | tail -n1 | cut -d= -f2 | tr -d '"' | tr -d "'")
          PORT=${PORT:-3000}
          for i in $(seq 1 12); do
            if curl -fsS "http://localhost:$PORT/login" > /dev/null 2>&1; then
              echo "OK: aplikasi hidup di port $PORT (versi $IMAGE_TAG)"
              exit 0
            fi
            sleep 5
          done

          echo "GAGAL: aplikasi tidak merespons di port $PORT. Log terakhir:"
          docker compose -f docker-compose.prod.yml logs --tail 50 app
          exit 1